<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'DejaVu Sans','Noto Color Emoji',sans-serif;font-weight:800}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff}
.abs{position:absolute}
.fill{position:absolute;left:0;top:0;width:1920px;height:1080px}
.stroke{-webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.c{display:flex;align-items:center;justify-content:center;text-align:center}
</style></head><body><div id="root"></div><script>
const THEMES={
 neon:{bg:['#10002b','#3a0ca3'],acc:['#ff2d95','#00f0ff','#ffe600','#7cff6b']},
 toxic:{bg:['#020b04','#0b3d1f'],acc:['#b6ff00','#00ffa3','#ffe600','#ff4d6d']},
 sunset:{bg:['#240046','#c9184a'],acc:['#ffd60a','#ff9e00','#ffffff','#00e5ff']},
 ice:{bg:['#03045e','#0077b6'],acc:['#caf0f8','#ffd60a','#ff5d8f','#7cff6b']},
 fire:{bg:['#1a0000','#9d0208'],acc:['#ffba08','#ff6d00','#ffffff','#00e5ff']},
 mono:{bg:['#0a0a0a','#2b2b2b'],acc:['#ffe600','#ff2d55','#00e5ff','#ffffff']},
 weltraum:{bg:['#05060f','#1b1650'],acc:['#ff8a5c','#ffd24a','#5bc0eb','#b388ff']}
};
let J=null;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const ob=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtNum=(v,dec)=>{const s=Number(v).toFixed(dec||0);const [i,d]=s.split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(d?','+d:'')};
window.init=async j=>{J=j;document.documentElement.style.zoom=(j.zoom||1);for(const s of j.scenes){if(s.type==='foto'&&s.url){await new Promise(r=>{const im=new Image();im.onload=()=>r();im.onerror=()=>r();im.src=s.url})}}return true};

function bg(t,th){
  const a=(t*10)%360;
  let h=`<div class="fill" style="background:linear-gradient(${a}deg,${th.bg[0]},${th.bg[1]})"></div>`;
  for(let i=0;i<3;i++){const x=960+Math.sin(t*.5+i*2.1)*700,y=540+Math.cos(t*.45+i)*260,r=480+i*80;
    h+=`<div class="abs" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:${th.acc[i%th.acc.length]};opacity:.2;filter:blur(110px)"></div>`}
  h+=`<div class="fill" style="background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 46px,transparent 46px 110px);background-position:${(t*50)%110}px 0"></div>`;
  return h;
}
function words(txt,lt,size,hl,acc,step=.1,w=1600){
  const ws=String(txt).split(' ');let h='';
  ws.forEach((x,i)=>{const p=clamp((lt-i*step)/.28);if(p<=0)return;const sc=1+(1-ob(p))*1.0;
    const isH=hl&&new RegExp(hl,'i').test(x);
    h+=`<span class="stroke" style="display:inline-block;margin:0 .13em;font-size:${size}px;line-height:1.08;transform:scale(${sc});color:${isH?acc:'#fff'};opacity:${clamp(p*3)}">${esc(x)}</span>`});
  return `<div style="width:${w}px;text-align:center">${h}</div>`;
}
const title=(t,y=88)=>t?`<div class="abs c stroke" style="left:100px;top:${y}px;width:1720px;height:120px;font-size:${String(t).length>34?46:56}px;line-height:1.1">${esc(t)}</div>`:'';
const S={
 hook(sc,lt,acc){
  const L=sc.text.length,size=sc.size||(L<=16?200:L<=28?168:L<=44?136:L<=64?108:90);
  const em=sc.emoji?`<div class="c" style="font-size:230px;height:250px;transform:scale(${1+(1-ob(lt/.35))*1.1}) rotate(${Math.sin(lt*7)*4}deg)">${sc.emoji}</div>`:'';
  const sh=lt<.5?Math.sin(lt*90)*(1-lt*2)*16:0;
  return `<div class="abs c" style="left:160px;top:${sc.emoji?100:150}px;width:1600px;height:${sc.emoji?680:640}px;flex-direction:column;transform:translateX(${sh}px)">${em}${words(sc.text,lt,size,sc.hl,acc)}</div>`},
 zitat(sc,lt,acc){
  const L=sc.text.length,size=L<=90?88:L<=150?72:60;
  return `<div class="abs" style="left:100px;top:150px;width:12px;height:540px;border-radius:6px;background:${acc}"></div><div class="abs c" style="left:170px;top:130px;width:1640px;height:600px">${words(sc.text,lt,size,sc.hl,acc,.065,1600)}</div>`},
 zahl(sc,lt,acc){
  const p=eo(lt/(sc.dur||1.4)),dec=sc.decimals||0,cur=(Number(sc.value)||0)*p;
  const fin=sc.text||fmtNum(sc.value,dec),txt=(sc.static||lt>(sc.dur||1.4))?fin:fmtNum(cur,dec);
  const n=fin.length,size=n<=4?400:n<=7?330:n<=10?260:190;
  return `<div class="abs c" style="left:100px;top:90px;width:1720px;height:700px;flex-direction:column">
   <div class="stroke" style="font-size:${size}px;line-height:1;color:${acc};transform:scale(${1+(1-ob(lt/.3))*.5})">${txt}</div>
   <div class="stroke" style="font-size:${size>260?92:76}px;margin-top:14px">${esc(sc.unit||'')}</div>
   <div style="font-size:60px;margin-top:26px;width:1500px;text-align:center;line-height:1.2;opacity:${clamp((lt-.5)/.3)};text-shadow:0 4px 18px #000">${esc(sc.label||'')}</div></div>`},
 karten(sc,lt,acc,th){
  const n=sc.items.length,step=n>5?100:n>4?112:130;let h='';
  sc.items.forEach((it,i)=>{const p=ob((lt-.15-i*.5)/.4);if(p<=0)return;const dir=i%2?1:-1,x=210+dir*(1-clamp(p,0,1))*1900,c=th.acc[i%th.acc.length];
    const dark=/^#(ff[e-f]|b6|ca|7c|ff[d-f])/i.test(c);
    h+=`<div class="abs" style="left:${x}px;top:${225+i*step}px;width:1500px;height:${step-22}px;border-radius:28px;background:${c};color:${dark?'#111':'#fff'};display:flex;align-items:center;padding:0 40px;gap:34px;box-shadow:0 10px 0 rgba(0,0,0,.35)">
     <div style="font-size:64px;min-width:64px">${i+1}</div><div style="font-size:${it.length>44?42:50}px;line-height:1.12">${esc(it)}</div></div>`});
  return title(sc.title)+h},
 vs(sc,lt,acc,th){
  const mx=Math.max(sc.a.value,sc.b.value),base=800;let h='';
  [['a',620,th.acc[0]],['b',1300,th.acc[1]]].forEach(([k,cx,c],i)=>{const d=sc[k],hh=Math.max(40,500*d.value/mx)*eo((lt-.2-i*.35)/.9),win=sc.win===k&&lt>1.8;
    h+=`<div class="abs" style="left:${cx-190}px;top:${base-hh}px;width:380px;height:${hh}px;border-radius:26px 26px 0 0;background:${c};box-shadow:0 0 ${win?60:0}px ${c}"></div>
     <div class="abs c stroke" style="left:${cx-300}px;top:${base-hh-110}px;width:600px;height:100px;font-size:${String(d.text).length>8?60:80}px;opacity:${clamp((lt-.9-i*.3)/.3)}">${esc(d.text)}</div>
     <div class="abs c" style="left:${cx-300}px;top:${base+10}px;width:600px;height:80px;font-size:52px;text-shadow:0 4px 14px #000">${esc(d.name)}${win?' 🏆':''}</div>`});
  return title(sc.title)+h},
 balken(sc,lt,acc,th){
  const mx=Math.max(...sc.items.map(i=>i.value)),n=sc.items.length,step=Math.min(140,580/n);let h='';
  sc.items.forEach((it,i)=>{const w=Math.max(30,960*it.value/mx)*eo((lt-.15-i*.3)/.8),y=235+i*step,c=th.acc[i%th.acc.length];
    h+=`<div class="abs" style="left:100px;top:${y}px;width:460px;height:${step-26}px;display:flex;align-items:center;font-size:44px;text-shadow:0 4px 14px #000">${esc(it.name)}</div>
     <div class="abs" style="left:580px;top:${y}px;width:${w}px;height:${step-26}px;border-radius:16px;background:${c}"></div>
     <div class="abs stroke" style="left:${600+w}px;top:${y}px;height:${step-26}px;display:flex;align-items:center;font-size:52px;white-space:nowrap;opacity:${clamp((lt-.6-i*.3)/.3)}">${esc(it.text)}</div>`});
  return title(sc.title)+h},
 foto(sc,lt,acc){
  const z=1.06+Math.min(lt/(sc.len||6),1)*.16,dx=Math.sin(lt*.5)*22;
  const cap=sc.caption?`<div class="abs c" style="left:100px;top:90px;width:1720px;height:200px;flex-direction:column">${words(sc.caption,lt,84,sc.hl,acc,.1,1720)}</div>`:'';
  return `<div class="abs" style="left:0;top:0;width:1920px;height:1080px;overflow:hidden"><div class="fill" style="background:#000 url('${sc.url}') center/cover;transform:scale(${z}) translateX(${dx}px)"></div>
   <div class="fill" style="background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 35%,transparent 62%,rgba(0,0,0,.7))"></div></div>${cap}
   <div class="abs" style="left:60px;top:1030px;font-size:24px;opacity:.85;text-shadow:0 2px 8px #000;font-weight:600">${esc(sc.credit||'')}</div>`},
 frage(sc,lt,acc,th){
  const op=sc.options||[];let h='';const w=op.length>2?540:700;
  op.forEach((o,i)=>{const p=ob((lt-.4-i*.25)/.4),pulse=1+Math.sin(lt*6+i)*.02,x=960-(op.length*(w+40)-40)/2+i*(w+40);
    h+=`<div class="abs c" style="left:${x}px;top:560px;width:${w}px;height:200px;border-radius:40px;background:${th.acc[i%th.acc.length]};color:#111;font-size:${o.length>22?44:56}px;padding:0 24px;transform:scale(${clamp(p,0,1.1)*pulse});box-shadow:0 12px 0 rgba(0,0,0,.35)">${esc(o)}</div>`});
  return `<div class="abs c" style="left:100px;top:110px;width:1720px;height:400px;flex-direction:column">${words(sc.text,lt,100,sc.hl,acc,.1,1700)}</div>${h}`},
 kapitel(sc,lt,acc){
  const p=ob(lt/.45);
  return `<div class="abs stroke" style="left:130px;top:70px;font-size:560px;line-height:1;color:${acc};opacity:${.95*clamp(lt/.2)};transform:scale(${.6+.4*clamp(p,0,1.1)});transform-origin:0 50%">${esc(sc.nr)}</div>
   <div class="abs" style="left:760px;top:330px;width:1060px">${words(sc.title,lt-.15,96,sc.hl,acc,.12,1060).replace('text-align:center','text-align:left')}</div>`},
 zeit(sc,lt,acc){
  const n=sc.events.length,x0=300,x1=1620,y=560;
  let h=title(sc.title)+`<div class="abs" style="left:${x0-80}px;top:${y-5}px;width:${(x1-x0+160)*eo(lt/.8)}px;height:10px;border-radius:5px;background:rgba(255,255,255,.4)"></div>`;
  sc.events.forEach((e,i)=>{const x=n===1?960:x0+i*(x1-x0)/(n-1),p=ob((lt-.3-i*.35)/.4);if(p<=0)return;const f=(sc.focus==null||sc.focus===i),up=i%2===0;
    h+=`<div class="abs" style="left:${x-28}px;top:${y-28}px;width:56px;height:56px;border-radius:50%;background:${f?acc:'rgba(255,255,255,.5)'};border:7px solid #000;transform:scale(${clamp(p,0,1.1)})"></div>
     <div class="abs" style="left:${x-220}px;top:${up?y-230:y+60}px;width:440px;text-align:center;${f?'':'opacity:.55'};opacity:${clamp(p)}"><div class="stroke" style="font-size:${sc.focus===i?76:60}px;color:${acc}">${esc(e.year)}</div><div style="font-size:38px;line-height:1.2;margin-top:6px;text-shadow:0 3px 12px #000">${esc(e.text)}</div></div>`});
  return h},
 thumb(sc,lt,acc,th){
  const L=sc.title.length,fs=L>26?128:L>14?160:200,big=String(sc.big||'');
  return `<div class="abs" style="left:90px;top:130px;width:1000px;font-size:${fs}px;line-height:1.02;font-family:'DejaVu Serif',serif" ><span class="stroke">${esc(sc.title)}</span></div>
   <div class="abs" style="left:96px;top:820px"><span style="display:inline-block;padding:14px 46px;border-radius:999px;background:${acc};color:#111;font-size:60px">${esc(sc.sub||'')}</span></div>
   <div class="abs stroke" style="right:80px;top:150px;width:720px;text-align:right;font-size:${big.length>3?300:460}px;line-height:1;color:${th.acc[2]}">${esc(big)}</div>`},
 satz(sc,lt,acc,th,t){
  const W=J.words.slice(sc.wi0,sc.wi1+1),n=W.length,size=n<=12?104:n<=20?88:n<=30?74:62;
  let h='';W.forEach((w,i)=>{const on=t>=w.s&&t<w.e+.15,past=t>=w.e+.15;
    const hl=J.hl&&new RegExp(J.hl,'i').test(w.w);
    h+=`<span class="stroke" style="display:inline-block;margin:0 .14em;font-size:${size}px;line-height:1.12;color:${on?'#ffe600':hl&&past?acc:'#fff'};opacity:${past||on?1:.32};transform:scale(${on?1.1:1})">${esc(w.w)}</span>`});
  return `<div class="abs c" style="left:140px;top:120px;width:1640px;height:680px"><div style="width:1640px;text-align:center">${h}</div></div>`}
};
function captions(t){
  const W=J.words;let ch=[],cur=[];
  W.forEach((w,i)=>{cur.push(i);const gap=i+1<W.length?W[i+1].s-w.e:9;if(cur.length>=4||gap>.35||/[.?!:]$/.test(J.raw?.[i]||'')){ch.push(cur);cur=[]}});if(cur.length)ch.push(cur);
  let c=null;for(let k=0;k<ch.length;k++){const s=W[ch[k][0]].s,nx=k+1<ch.length?W[ch[k+1][0]].s:J.dur;if(t>=s-.03&&t<nx){c=ch[k];break}}
  if(!c)return '';
  const tot=c.reduce((a,i)=>a+W[i].w.length,0),fs=tot<=18?80:tot<=28?68:58;
  return `<div class="abs" style="left:110px;top:850px;width:1700px;height:190px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:0 34px">`+c.map(i=>{const w=W[i],on=t>=w.s&&t<w.e+.12;
    const hl=J.hl&&new RegExp(J.hl,'i').test(w.w);
    return `<span class="stroke" style="display:inline-block;font-size:${fs}px;line-height:1.12;transform:scale(${on?1.1:1});color:${on||hl?'#ffe600':'#fff'}">${esc(w.w)}</span>`}).join('')+`</div>`;
}
window.frame=t=>{
  const th=THEMES[J.theme]||THEMES.neon;
  let idx=0;J.scenes.forEach((s,i)=>{if(t>=s.s)idx=i});const sc=J.scenes[idx],lt=t-sc.s,acc=th.acc[idx%th.acc.length];
  const punch=1+Math.max(0,1-lt/.22)*.04;
  let h=bg(t,th);
  h+=`<div class="fill" style="transform:scale(${punch});transform-origin:50% 45%">${(S[sc.type]||S.hook)(sc,lt,acc,th,t)}</div>`;
  if(sc.type!=='satz'&&sc.type!=='zitat')h+=captions(t);
  if(idx>0&&lt<.12&&sc.flash!==false)h+=`<div class="fill" style="background:#fff;opacity:${.4*(1-lt/.12)}"></div>`;
  h+=`<div class="abs" style="left:80px;top:26px;width:1760px;height:10px;border-radius:5px;background:rgba(255,255,255,.25)"><div style="width:${clamp(t/J.dur)*100}%;height:10px;border-radius:5px;background:${acc}"></div></div>`;
  if(sc.kicker)h+=`<div class="abs" style="left:80px;top:50px;padding:5px 20px;border-radius:999px;background:${acc};color:#111;font-size:30px">${esc(sc.kicker)}</div>`;
  document.getElementById('root').innerHTML=h;
  return true;
};
</script></body></html>
