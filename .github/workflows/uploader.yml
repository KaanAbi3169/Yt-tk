name: uploader

# Plant die Videos des Tages in Buffer, ohne Claude (laeuft auch bei verbrauchtem Claude-Limit).
# Geplante Laeufe (Zeitplan) sind LIVE. Not-Aus: Repository-Variable UPLOADER_LIVE = false (oder PAUSE/STOP-Datei).
# Manuelle Laeufe sind Trockenlauf, ausser die Eingabe 'live' ist gesetzt.
on:
  schedule:
    - cron: "37 5 * * *"   # 06:37 MEZ (Winter) / 07:37 MESZ (Sommer)
    - cron: "37 7 * * *"   # zweiter Versuch, harmlos wegen Doppelschutz
  workflow_dispatch:
    inputs:
      args:
        description: "Optionale Argumente, z. B. --introspect oder --day 2026-11-18"
        required: false
        default: ""
      live:
        description: "Live planen (nur fuer diesen manuellen Lauf)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.BUFFER_API_KEY != '' }}
    steps:
      - name: Ohne Key nichts tun (kein Fehlalarm)
        if: env.HAS_KEY != 'true'
        run: echo "::notice::BUFFER_API_KEY ist noch nicht gesetzt - Uploader macht nichts."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: media
          path: media
          sparse-checkout: data
          fetch-depth: 1
      - name: Git-Benutzer fuer den Daten-Branch
        if: env.HAS_KEY == 'true'
        run: |
          git -C media config user.name "uploader"
          git -C media config user.email "uploader@users.noreply.github.com"
      - name: Uploader
        if: env.HAS_KEY == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YTTK_DATA: ${{ github.workspace }}/media
          UPLOADER_LIVE: ${{ github.event_name == 'schedule' && (vars.UPLOADER_LIVE != 'false') || inputs.live }}
          ARGS: ${{ inputs.args }}
        run: python3 -m yt_tk.uploader $ARGS
      - name: Fehler melden (GitHub-Ticket, ohne Claude)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ ${context.workflow} fehlgeschlagen`;
            const body = `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: open} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 50});
            const hit = open.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({...context.repo, issue_number: hit.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
