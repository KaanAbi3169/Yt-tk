name: compile

# V-023: Baut das Zusammenschnitt-Langvideo L001 (10 Haushaltstricks) aus Vorrats-Shorts, ohne Claude, 0 EUR.
# Zeitplan: --auto (siehe unten). Von Hand: --all, --id L00x oder --dry. Ergebnis: Branch media -> videos/L001.mp4 und Eintrag im Inventar (Status ready).
on:
  schedule:
    - cron: "30 3 * * *"   # 04:30 MEZ: ist der Vorrat an Langvideos unter 3, wird das naechste Zusammenschnitt-Video gebaut (ohne Claude)
  workflow_dispatch:
    inputs:
      args:
        description: "Optionale Argumente, z. B. --dry (nur bauen und pruefen)"
        required: false
        default: "--dry"

permissions:
  contents: write
  issues: write

concurrency:
  group: compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: media
          path: media
          sparse-checkout: data
          fetch-depth: 1
      - name: Git-Benutzer fuer den Daten-Branch
        run: |
          git -C media config user.name "compile"
          git -C media config user.email "compile@users.noreply.github.com"
      - name: ffmpeg und Schriften installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil
      - name: Zusammenschnitt bauen
        env:
          YTTK_DATA: ${{ github.workspace }}/media
          ARGS: ${{ github.event_name == 'schedule' && '--auto' || inputs.args }}
        run: python3 -m yt_tk.compile_long $ARGS
      - name: Fehler melden (GitHub-Ticket, ohne Claude)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ ${context.workflow} fehlgeschlagen`;
            const body = `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: open} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 50});
            const hit = open.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({...context.repo, issue_number: hit.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
