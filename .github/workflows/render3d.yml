name: render3d

# V-034: Baut ein 3D-Video (Szene aus render3d/scenes, Texte aus content3d/<ID>.json, Sprache aus audio/<ID>.mp3 auf dem Daten-Branch).
# Ohne Claude, 0 EUR. Ergebnis: media -> videos/<ID>.mp4, thumbs/<ID>.jpg, Inventar-Eintrag (Status pinned). Von Hand startbar.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Video-ID, z. B. T001"
        required: true
      args:
        description: "Optionale Argumente, z. B. --px 1 oder --dry"
        required: false
        default: "--px 2"

permissions:
  contents: write
  issues: write

concurrency:
  group: render3d-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: media
          path: media
          sparse-checkout: |
            data
            audio
          fetch-depth: 1
      - name: Git-Benutzer fuer den Daten-Branch
        run: |
          git -C media config user.name "render3d"
          git -C media config user.email "render3d@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ffmpeg, Schriften, Whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet faster-whisper
      - name: three.js und Chromium
        working-directory: render3d
        run: |
          npm install --silent three@0.160.0 playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Video bauen
        env:
          YTTK_DATA: ${{ github.workspace }}/media
          VID: ${{ inputs.id }}
          ARGS: ${{ inputs.args }}
        run: python3 -m yt_tk.build3d --id "$VID" $ARGS
      - name: Fehler melden (GitHub-Ticket, ohne Claude)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ ${context.workflow} fehlgeschlagen`;
            const body = `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({...context.repo, title, body});
