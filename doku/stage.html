<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'DejaVu Sans',sans-serif}
#root{position:relative;width:1920px;height:1080px;color:var(--text);
  background:radial-gradient(1400px 900px at 82% 8%,var(--glow) 0%,transparent 60%),linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden}
#root:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:46px 46px;opacity:.55}
.ring{position:absolute;border-radius:50%;border:3px solid var(--accent);opacity:.18}
.kicker{position:absolute;left:120px;top:78px;font-size:30px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand{position:absolute;right:120px;top:78px;font-size:26px;letter-spacing:.2em;color:var(--text);opacity:.55;text-transform:uppercase}
.src{position:absolute;left:120px;bottom:64px;font-size:26px;color:var(--text);opacity:.6;max-width:1500px}
.bar{position:absolute;left:120px;width:150px;height:12px;border-radius:6px;background:var(--accent)}
h1{font-family:'DejaVu Serif',serif;font-weight:700;line-height:1.08}
.abs{position:absolute}
.dim{opacity:.38}
.pill{display:inline-block;padding:6px 22px;border-radius:999px;background:var(--accent);color:var(--bg1);font-weight:700}
</style></head><body><div id="root"></div><script>
const THEMES={
 nacht:{bg1:'#0b1230',bg2:'#1c2a63',glow:'rgba(79,163,255,.35)',accent:'#ffd24a',accent2:'#5bc0eb',text:'#f2f5ff'},
 tiefsee:{bg1:'#021a2e',bg2:'#0a4a78',glow:'rgba(126,224,240,.30)',accent:'#7ee0f0',accent2:'#ffd24a',text:'#eaf8ff'},
 weltraum:{bg1:'#05060f',bg2:'#1b1650',glow:'rgba(160,120,255,.35)',accent:'#ff8a5c',accent2:'#ffd24a',text:'#f4f0ff'},
 erde:{bg1:'#1d2a1a',bg2:'#46602e',glow:'rgba(255,210,74,.28)',accent:'#ffd24a',accent2:'#9be37a',text:'#f6f8ee'},
 papier:{bg1:'#f3ead8',bg2:'#e2d3b3',glow:'rgba(180,90,60,.22)',accent:'#b8412e',accent2:'#2d5a8a',text:'#24201a'},
 glut:{bg1:'#2a0f0a',bg2:'#7a2a14',glow:'rgba(255,170,60,.34)',accent:'#ffcf5a',accent2:'#ff7a4a',text:'#fff3e6'}
};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const root=document.getElementById('root');
function theme(t){const T=THEMES[t]||THEMES.nacht;for(const k in T)root.style.setProperty('--'+k,T[k])}
function base(spec,o={}){
  root.innerHTML='';
  const rings=[[1500,-300,620],[-160,720,380]];
  for(const [x,y,s] of rings){const r=document.createElement('div');r.className='ring';r.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px`;root.appendChild(r)}
  if(spec.kicker&&!o.nokicker)root.insertAdjacentHTML('beforeend',`<div class="kicker">${esc(spec.kicker)}</div>`);
  if(!o.nobrand)root.insertAdjacentHTML('beforeend',`<div class="brand">Ai · Wissen</div>`);
  if(spec.source)root.insertAdjacentHTML('beforeend',`<div class="src">Quelle: ${esc(spec.source)}</div>`);
}
const R={
 titel(s){base(s,{nokicker:1});
  root.insertAdjacentHTML('beforeend',`<div class="bar" style="top:300px"></div>
  <h1 class="abs" style="left:120px;top:340px;width:1500px;font-size:${s.title.length>46?92:116}px">${esc(s.title)}</h1>
  <div class="abs" style="left:124px;top:${s.title.length>46?640:690}px;width:1400px;font-size:44px;opacity:.85;line-height:1.3">${esc(s.sub||'')}</div>
  <div class="abs" style="left:124px;top:900px"><span class="pill" style="font-size:30px">${esc(s.tag||'Dokumentation')}</span></div>`)},
 kapitel(s){base(s,{nokicker:1});
  root.insertAdjacentHTML('beforeend',`<div class="abs" style="left:120px;top:210px;font-size:420px;font-weight:800;color:var(--accent);opacity:.9;line-height:1">${esc(s.nr)}</div>
  <h1 class="abs" style="left:120px;top:660px;width:1650px;font-size:104px">${esc(s.title)}</h1>
  <div class="bar" style="top:620px"></div>`)},
 zahl(s){base(s);
  const v=String(s.value);const fs=v.length>9?200:v.length>6?250:320;
  root.insertAdjacentHTML('beforeend',`<div class="abs" style="left:120px;top:250px;font-size:${fs}px;font-weight:800;color:var(--accent);line-height:1;white-space:nowrap">${esc(v)}<span style="font-size:${Math.round(fs*0.34)}px;color:var(--text);opacity:.9"> ${esc(s.unit||'')}</span></div>
  <div class="abs" style="left:124px;top:${250+Math.round(fs*1.12)}px;width:1600px;font-size:64px;font-weight:700;line-height:1.2">${esc(s.label||'')}</div>
  <div class="abs" style="left:124px;top:${250+Math.round(fs*1.12)+((s.label||'').length>42?170:100)}px;width:1500px;font-size:38px;opacity:.78;line-height:1.35">${esc(s.note||'')}</div>`)},
 liste(s){base(s);
  const n=s.items.length,step=Math.min(150,Math.round(640/n));
  let h=`<h1 class="abs" style="left:120px;top:150px;width:1650px;font-size:76px">${esc(s.title||'')}</h1>`;
  s.items.forEach((it,i)=>{const y=330+i*step,d=(s.focus!=null&&s.focus!==i)?' dim':'';
   h+=`<div class="abs${d}" style="left:120px;top:${y}px;width:1700px;height:${step-14}px;display:flex;align-items:center;gap:34px">
   <div style="flex:none;width:78px;height:78px;border-radius:50%;background:var(--accent);color:var(--bg1);font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center">${i+1}</div>
   <div style="font-size:${n>5?42:50}px;line-height:1.2">${esc(it)}</div></div>`});
  root.insertAdjacentHTML('beforeend',h)},
 vergleich(s){base(s);
  const max=Math.max(...s.bars.map(b=>b.value)),n=s.bars.length,y0=(s.title||'').length>40?370:310,step=Math.min(130,Math.round((1000-y0)/n));
  let h=`<h1 class="abs" style="left:120px;top:150px;width:1650px;font-size:70px">${esc(s.title||'')}</h1>`;
  s.bars.forEach((b,i)=>{const y=y0+i*step,w=Math.max(8,Math.round(1000*b.value/max)),hl=(s.highlight==null||s.highlight===i);
   h+=`<div class="abs" style="left:120px;top:${y}px;width:420px;height:${step-26}px;display:flex;align-items:center;font-size:40px;font-weight:700;${hl?'':'opacity:.5'}">${esc(b.label)}</div>
   <div class="abs" style="left:560px;top:${y}px;width:${w}px;height:${step-26}px;border-radius:14px;background:${hl?(i===s.highlight?'var(--accent)':'var(--accent2)'):'rgba(255,255,255,.28)'}"></div>
   <div class="abs" style="left:${580+w}px;top:${y}px;height:${step-26}px;display:flex;align-items:center;font-size:40px;font-weight:800;white-space:nowrap">${esc(b.text||(b.value+(s.unit?' '+s.unit:'')))}</div>`});
  root.insertAdjacentHTML('beforeend',h)},
 zeitleiste(s){base(s);
  const n=s.events.length,x0=200,x1=1720,y=560;
  let h=`<h1 class="abs" style="left:120px;top:150px;width:1650px;font-size:70px">${esc(s.title||'')}</h1>
   <div class="abs" style="left:${x0-60}px;top:${y-4}px;width:${x1-x0+120}px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)"></div>`;
  s.events.forEach((e,i)=>{const x=n===1?960:x0+i*(x1-x0)/(n-1),f=(s.focus==null||s.focus===i),up=i%2===0;
   h+=`<div class="abs" style="left:${x-24}px;top:${y-24}px;width:48px;height:48px;border-radius:50%;background:${f?'var(--accent)':'rgba(255,255,255,.4)'};border:6px solid var(--bg1)"></div>
   <div class="abs" style="left:${x-190}px;top:${up?y-170:y+50}px;width:380px;text-align:center;${f?'':'opacity:.4'}">
    <div style="font-size:${s.focus===i?66:52}px;font-weight:800;color:var(--accent)">${esc(e.year)}</div>
    <div style="font-size:34px;line-height:1.25;margin-top:6px">${esc(e.text)}</div></div>`});
  root.insertAdjacentHTML('beforeend',h)},
 fakt(s){base(s);
  root.insertAdjacentHTML('beforeend',`<div class="abs" style="left:120px;top:250px;width:12px;height:520px;border-radius:6px;background:var(--accent)"></div>
  <div class="abs" style="left:190px;top:250px;width:1500px;font-size:${s.text.length>150?58:s.text.length>90?68:80}px;font-weight:700;line-height:1.22">${esc(s.text)}</div>`)},
 frage(s){base(s);
  let h=`<h1 class="abs" style="left:120px;top:190px;width:1650px;font-size:86px">${esc(s.question)}</h1>`;
  (s.options||[]).forEach((o,i)=>{const x=120+i*(1680/(s.options.length)),w=1680/s.options.length-40;
   h+=`<div class="abs" style="left:${x}px;top:560px;width:${w}px;height:260px;border-radius:28px;background:rgba(255,255,255,.1);border:4px solid var(--accent);padding:32px">
   <div style="font-size:72px;font-weight:800;color:var(--accent)">${'ABCD'[i]}</div><div style="font-size:44px;margin-top:10px;line-height:1.2">${esc(o)}</div></div>`});
  root.insertAdjacentHTML('beforeend',h)},
 vorschau(s){base(s,{nokicker:1,nobrand:1,source:0});  // Vorschaubild 1920x1080, wird auf 1280x720 skaliert
  const L=s.title.length,fs=L>26?150:L>14?190:240;
  root.insertAdjacentHTML('beforeend',`<div class="abs" style="left:100px;top:150px;width:1000px;font-family:'DejaVu Serif',serif;font-size:${fs}px;font-weight:800;line-height:1.02;text-shadow:0 8px 40px rgba(0,0,0,.45)">${esc(s.title)}</div>
  <div class="abs" style="left:106px;top:880px"><span class="pill" style="font-size:62px;padding:14px 48px">${esc(s.sub||'')}</span></div>
  <div class="abs" style="right:70px;top:170px;width:760px;text-align:right;font-size:${String(s.big||'').length>3?330:520}px;font-weight:800;color:var(--accent);line-height:1;text-shadow:0 8px 40px rgba(0,0,0,.4)">${esc(s.big||'')}</div>`)}
};
window.show=(spec)=>{theme(spec.theme);R[spec.type](spec);window.ready=true};
</script></body></html>
