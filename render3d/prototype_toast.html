<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
const W=540,H=960;               // Vorschau; fertig 1080x1920 per Skalierung
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(parseFloat(new URLSearchParams(location.search).get('px')||'1'));
renderer.setSize(W,H); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfe3f5); scene.fog=new THREE.Fog(0xbfe3f5,14,30);
const cam=new THREE.PerspectiveCamera(52,W/H,0.1,60);
scene.add(new THREE.HemisphereLight(0xffffff,0xd9c3a5,0.9));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(4,8,5); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30}); scene.add(sun);
const mat=(c,r=0.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r,flatShading:true});
const add=(g,m,x,y,z,parent=scene)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o};
// Raum
add(new THREE.BoxGeometry(14,0.2,14),mat(0xe9d3b0),0,-0.1,0);                 // Boden
add(new THREE.BoxGeometry(14,7,0.2),mat(0x4f86c6),0,3.5,-4.2);                // Rueckwand (blau)
add(new THREE.BoxGeometry(0.2,7,14),mat(0xf3b46b),-5.2,3.5,0);                // Seitenwand (orange)
add(new THREE.BoxGeometry(3.2,2.2,0.15),mat(0xffe9a8),-1.2,4.2,-4.05);        // Fenster
add(new THREE.BoxGeometry(2.6,1.6,0.2),mat(0x9fd3f2),-1.2,4.2,-3.98);
// Schrank + Tisch
add(new THREE.BoxGeometry(4.6,1.6,1.2),mat(0xe0883a),2.8,0.8,-3.4);
add(new THREE.BoxGeometry(4.6,0.14,1.3),mat(0xf6e7c8),2.8,1.67,-3.4);
const table=new THREE.Group(); scene.add(table);
add(new THREE.BoxGeometry(3.4,0.22,2.0),mat(0xb5733a),0,1.5,0,table);
for(const [x,z] of [[-1.5,-0.8],[1.5,-0.8],[-1.5,0.8],[1.5,0.8]]) add(new THREE.BoxGeometry(0.22,1.4,0.22),mat(0x8a5428),x,0.7,z,table);
add(new THREE.CylinderGeometry(0.7,0.55,0.08,24),mat(0xffffff,0.4),-0.6,1.66,0.1,table);  // Teller
// Toast (Butterseite = gelb oben)
const toast=new THREE.Group(); scene.add(toast);
add(new THREE.BoxGeometry(0.62,0.07,0.62),mat(0xd9a45a),0,0,0,toast);
const butter=add(new THREE.BoxGeometry(0.54,0.02,0.54),mat(0xffe27a,0.5),0,0.045,0,toast);
// Figur
const fig=new THREE.Group(); scene.add(fig);
const skin=mat(0xf2b88a), shirt=mat(0xf07a1a), pants=mat(0x2f5bd1);
add(new THREE.CapsuleGeometry(0.2,0.8,4,10),pants,-0.18,0.65,0,fig); add(new THREE.CapsuleGeometry(0.2,0.8,4,10),pants,0.18,0.65,0,fig);
add(new THREE.CapsuleGeometry(0.42,0.7,6,12),shirt,0,1.75,0,fig);
const head=new THREE.Group(); head.position.set(0,2.85,0); fig.add(head);
add(new THREE.SphereGeometry(0.55,16,12),skin,0,0,0,head);
add(new THREE.SphereGeometry(0.07,8,8),mat(0x111111),-0.2,0.08,0.5,head); add(new THREE.SphereGeometry(0.07,8,8),mat(0x111111),0.2,0.08,0.5,head);
add(new THREE.BoxGeometry(0.3,0.04,0.04),mat(0x111111),0,-0.2,0.53,head);
const armL=new THREE.Group(); armL.position.set(-0.5,2.2,0); fig.add(armL); add(new THREE.CapsuleGeometry(0.11,0.7,4,8),skin,0,-0.4,0,armL);
const armR=new THREE.Group(); armR.position.set(0.5,2.2,0); fig.add(armR); add(new THREE.CapsuleGeometry(0.11,0.7,4,8),skin,0,-0.4,0,armR);
fig.position.set(-0.7,0,-1.35); fig.rotation.y=0.2; fig.scale.setScalar(0.85);
const ease=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,k)=>a+(b-a)*k;
// deterministischer Zustand zur Zeit t (Sekunden)
window.setTime=(t)=>{
  // Toast rutscht vom Teller zum Tischrand (0.5 bis 1.4 s), kippt, faellt (1.4 bis 2.2 s) und landet mit der Butterseite unten
  const slide=ease(clamp((t-0.5)/0.9)), k=clamp((t-1.4)/0.8), fall=k*k;
  const x=lerp(-0.6,1.62,slide)+k*0.55;
  toast.position.set(x, lerp(1.66,1.64,slide)-fall*1.58, lerp(0.1,0.25,slide)+k*0.2);
  toast.rotation.set(k*Math.PI, k*0.3, -k*0.5*(1-k)+k*0.1);
  // Figur zeigt mit dem Arm auf den Toast und reagiert
  armR.rotation.z=lerp(0.2,-2.0,clamp((t-0.2)/0.6))+Math.sin(t*5)*0.08*clamp(t-1.5); armL.rotation.z=0.25;
  head.rotation.y=lerp(0.0,-0.5,clamp(t/1.0)); head.rotation.x=k*0.25; fig.position.y=Math.abs(Math.sin(t*2.2))*0.03;
  // Kamera: Fahrt ran, am Ende auf den gelandeten Toast
  const a=ease(clamp(t/3.2)), b=ease(clamp((t-2.2)/1.6));
  cam.position.set(lerp(lerp(2.4,1.4,a),2.6,b), lerp(lerp(3.2,2.5,a),1.7,b), lerp(lerp(7.6,5.4,a),4.2,b));
  cam.lookAt(lerp(lerp(0.2,0.7,a),2.1,b), lerp(lerp(2.0,1.6,a),0.3,b), lerp(0,0.2,b));
  renderer.render(scene,cam);
};
window.ready=true; setTime(0);
</script></body></html>
