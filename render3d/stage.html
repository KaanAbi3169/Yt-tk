<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
<body><script type="module">
// Gemeinsame Buehne fuer alle 3D-Videos (V-034): Renderer, Licht, Kamera, Hilfen. Die Szene kommt aus scenes/<name>.js.
import * as THREE from 'three';
const q=new URLSearchParams(location.search);
const W=540,H=960,px=parseFloat(q.get('px')||'1');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(px); renderer.setSize(W,H); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(52,W/H,0.1,80);
scene.add(new THREE.HemisphereLight(0xffffff,0xd9c3a5,0.95));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(4,9,6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:35}); scene.add(sun);
const mat=(c,r=0.85,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,flatShading:true,...extra});
const add=(g,m,x=0,y=0,z=0,parent=scene)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o};
const ease=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,k)=>a+(b-a)*k;
const pop=x=>{x=clamp(x);return x<1?1+2.2*Math.pow(x-1,3)+1.2*Math.pow(x-1,2):1}; // Ueberschwinger 0..1
function textPlane(text,{w=3,h=1,color='#fff',bg=null,size=120,weight='900',font='DejaVu Sans',stroke=null,radius=0}={}){
  const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*h/w);const g=c.getContext('2d');
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const draw=(txt)=>{
    g.clearRect(0,0,c.width,c.height);
    if(bg){g.fillStyle=bg;g.beginPath();g.roundRect(0,0,c.width,c.height,radius);g.fill()}
    let sz=size;g.font=`${weight} ${sz}px "${font}"`;g.textAlign='center';g.textBaseline='middle';
    while(g.measureText(txt).width>c.width*0.9&&sz>20){sz-=6;g.font=`${weight} ${sz}px "${font}"`}   // Text immer einpassen
    if(stroke){g.lineWidth=sz/6;g.strokeStyle=stroke;g.strokeText(txt,c.width/2,c.height/2)}
    g.fillStyle=color;g.fillText(txt,c.width/2,c.height/2);t.needsUpdate=true};
  draw(text);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));m.renderOrder=5;m.userData.redraw=draw;return m}
// Wortzeiten (aus der Sprache), T = Beginn, TE = Ende des n-ten Wortes, das auf das Muster passt
const words=await (await fetch('/words.json')).json();
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const find=(re,n=0)=>words.filter(w=>re.test(norm(w.w)))[n];
const T=(re,n=0,fb=null)=>{const w=find(re,n);return w?w.s:fb}, TE=(re,n=0,fb=null)=>{const w=find(re,n);return w?w.e:fb};
const D=words.length?words[words.length-1].e+0.8:30;
// wiederkehrende Kanalfigur
function makeFigure({headScale=1,shirt=0xf07a1a,pants=0x2f5bd1,skin=0xf2b88a}={}){
  const g=new THREE.Group(),sk=mat(skin);
  add(new THREE.CapsuleGeometry(0.2,0.8,4,10),mat(pants),-0.18,0.65,0,g);add(new THREE.CapsuleGeometry(0.2,0.8,4,10),mat(pants),0.18,0.65,0,g);
  add(new THREE.CapsuleGeometry(0.42,0.7,6,12),mat(shirt),0,1.75,0,g);
  const head=new THREE.Group();head.position.set(0,2.85,0);head.scale.setScalar(headScale);g.add(head);
  const skull=add(new THREE.SphereGeometry(0.55,16,12),sk,0,0,0,head);
  add(new THREE.SphereGeometry(0.07,8,8),mat(0x111111),-0.2,0.08,0.5,head);add(new THREE.SphereGeometry(0.07,8,8),mat(0x111111),0.2,0.08,0.5,head);
  const mouth=add(new THREE.BoxGeometry(0.3,0.04,0.04),mat(0x111111),0,-0.2,0.53,head);
  const armL=new THREE.Group();armL.position.set(-0.5,2.2,0);g.add(armL);add(new THREE.CapsuleGeometry(0.11,0.7,4,8),sk,0,-0.4,0,armL);
  const armR=new THREE.Group();armR.position.set(0.5,2.2,0);g.add(armR);add(new THREE.CapsuleGeometry(0.11,0.7,4,8),sk,0,-0.4,0,armR);
  scene.add(g);return {group:g,head,skull,mouth,armL,armR}}
// echte Bilder (V-034 + Auftrag 19.11.): images/index.json listet die IDs, die Szene holt sie mit photo(id, breite)
const imgIds=await fetch('/images/index.json').then(r=>r.ok?r.json():[]).catch(()=>[]);
const tex={};await Promise.all(imgIds.map(id=>new Promise(res=>new THREE.TextureLoader().load(`/images/${id}.jpg`,t=>{t.colorSpace=THREE.SRGBColorSpace;tex[id]=t;res()},undefined,()=>res()))));
function photo(id,w=2.4,{frame=0.06}={}){
  const t=tex[id]; if(!t) throw new Error('Bild fehlt: '+id);
  const h=w*t.image.height/t.image.width, g=new THREE.Group();
  const back=new THREE.Mesh(new THREE.BoxGeometry(w+frame*2,h+frame*2,0.04),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8}));back.castShadow=true;g.add(back);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));p.position.z=0.03;g.add(p);
  scene.add(g);g.userData={w,h};return g}
const kit=await fetch('/scene.json').then(r=>r.ok?r.json():null).catch(()=>null);   // Szenenbaukasten: Beschreibung des Videos
const stage={THREE,scene,cam,renderer,sun,W,H,mat,add,textPlane,ease,clamp,lerp,pop,T,TE,D,words,makeFigure,photo,kit,norm};
const mod=await import('/scenes/'+q.get('scene')+'.js');
const sc=mod.default(stage);
window.duration=D;
window.setTime=t=>{sc.update(t);renderer.render(scene,cam)};
window.ready=true;window.setTime(0);
</script></body></html>
